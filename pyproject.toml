[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzrex"
version = "0.1.0"
description = "Black-box fuzzer for REST APIs and configuration files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
baseline = [
    "schemathesis>=4.0",
]

[project.scripts]
fuzzrex = "fuzzrex.cli:main"

[tool.setuptools.packages.find]
include = ["fuzzrex*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
