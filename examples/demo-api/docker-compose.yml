services:
  demo-api:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - ./config.json:/app/config.json
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
